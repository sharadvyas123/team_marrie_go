x-app-defaults: &app-defaults
  init: true
  restart: unless-stopped
  networks:
    - accessmap

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: accessmap
      POSTGRES_USER: accessmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-not-secret}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - accessmap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessmap -d accessmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    networks:
      - accessmap
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    # Docker Hub no longer serves the old minio/minio repository. LocalStack
    # provides a pinned, public S3-compatible endpoint for local development.
    image: localstack/localstack:4.10.0
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEBUG: "0"
      PERSISTENCE: "1"
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "127.0.0.1:9000:4566"
    volumes:
      - storage-data:/var/lib/localstack
    networks:
      - accessmap
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - accessmap

  api:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      APP_VERSION: ${APP_VERSION:-0.1.0}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-only-auth-secret-change-me}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-local-development-only-qr-secret-change-me}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-local-development-webhook-key}
      DATABASE_URL: ${DATABASE_URL:-postgresql://accessmap:local-only-not-secret@postgres:5432/accessmap}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://storage:4566}
      STORAGE_BUCKET_PRIVATE: ${STORAGE_BUCKET_PRIVATE:-accessmap-private}
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-accessmap-public}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:9000/accessmap-public}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/http-healthcheck.mjs", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  worker:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://accessmap:local-only-not-secret@postgres:5432/accessmap}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379}
      WORKER_DATABASE_POOL_SIZE: "${WORKER_DATABASE_POOL_SIZE:-5}"
      OUTBOX_STREAM: ${OUTBOX_STREAM:-accessmap:events}
      OUTBOX_BATCH_SIZE: "${OUTBOX_BATCH_SIZE:-25}"
      OUTBOX_LEASE_MS: "${OUTBOX_LEASE_MS:-60000}"
      OUTBOX_MAX_ATTEMPTS: "${OUTBOX_MAX_ATTEMPTS:-5}"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/worker-healthcheck.mjs"]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 5

  scheduler:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: Dockerfile.scheduler
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SCHEDULER_INTERVAL_SECONDS: "${SCHEDULER_INTERVAL_SECONDS:-3600}"
      SCHEDULER_RUN_ON_START: "${SCHEDULER_RUN_ON_START:-false}"
      SCHEDULER_MAX_RUNTIME_SECONDS: "${SCHEDULER_MAX_RUNTIME_SECONDS:-900}"
      SCHEDULER_COMMAND: "${SCHEDULER_COMMAND:-}"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/process-healthcheck.mjs", "scheduler"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 5

volumes:
  postgres-data:
  valkey-data:
  storage-data:

networks:
  accessmap:
    driver: bridge
